name: Final lottery project checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Node dependencies
        run: npm install
      - name: Prepare Python and graphical test environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb python3-tk
          python -m venv python/.venv
          python/.venv/bin/python -m pip install -r python/requirements.txt
          python/.venv/bin/python -m pip freeze > python/requirements-lock.txt
          python/.venv/bin/python -m pip install pillow
      - name: Compile and test contracts
        run: |
          npx hardhat compile
          npx hardhat test
      - name: Deploy and test signed Python transactions and Tkinter
        shell: bash
        run: |
          npx hardhat node > /dev/null 2>&1 &
          NODE_PID=$!
          trap 'kill "$NODE_PID" 2>/dev/null || true' EXIT
          for attempt in {1..40}; do
            if curl --fail --silent -H 'Content-Type: application/json' \
              --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' \
              http://127.0.0.1:8545 | grep -q '0x7a69'; then
              break
            fi
            sleep 1
          done
          npm run deploy
          mkdir -p test-results
          xvfb-run -a -s '-screen 0 1280x1024x24' python/.venv/bin/python -m unittest discover -s python/tests -v 2>&1 | tee test-results/python-tests.txt
      - name: Export generated resources for verification
        if: success()
        run: |
          node --input-type=module -e 'import fs from "node:fs"; for (const path of ["python/abi/Lottery.json", "python/abi/PrizeDistributor.json", "python/contract_addresses.json", "python/requirements-lock.txt"]) console.log("RESOURCE_JSON " + JSON.stringify({path, content:fs.readFileSync(path,"utf8")}));'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lottery-verification
          path: |
            python/abi/
            python/contract_addresses.json
            python/requirements-lock.txt
            test-results/
          if-no-files-found: ignore
